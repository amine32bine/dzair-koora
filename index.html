.prayer b{font-weight:800}.prayer .cd{margin-inline-start:auto;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums}
.prayer.soon{animation:soon 1.6s ease-in-out infinite}@keyframes soon{50%{background:#e9cb5e}}
header{background:var(--g);color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center}
header img{width:42px;height:42px;border-radius:50%;background:#fff}
header h1{margin:0;font-size:21px;line-height:1.2}header small{opacity:.85;font-size:13px}
.times{display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto}
.times div{flex:1;min-width:58px;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 4px;font-size:13px;color:var(--mut)}
.times b{display:block;color:var(--tx);font-size:15px;direction:ltr}.times .on{border-color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold)}
main{padding:6px 16px 20px}
h2{font-size:15px;color:var(--mut);margin:16px 0 8px;font-weight:600}

.gl{font-size:12px;color:var(--mut);margin:8px 0 -2px;font-weight:600}

.t{text-align:center;font-size:15px}.c{text-align:center;min-width:76px}.score{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}
.c small{display:block;color:var(--mut);font-size:12px}.live .score,.live small{color:var(--r);font-weight:800}

.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;white-space:nowrap}th{color:var(--mut);font-weight:500;border-bottom:1px solid var(--line)}
td:nth-child(2),th:nth-child(2){text-align:start;width:100%}tr+tr td{border-top:1px solid var(--line)}
.sc{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.sc .k{width:24px;text-align:center;color:var(--mut)}.sc .w{flex:1}.sc small{display:block;color:var(--mut)}.sc .g{font-size:22px;font-weight:800}
.pl{direction:ltr;text-align:left}html[dir=rtl] .pl{text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);margin-bottom:8px}
.btn{font:inherit;border:0;background:var(--g);color:#fff;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700}
.btn.alt{background:none;color:var(--g);border:1px solid var(--g)}.btn.red{background:var(--r)}
.row{display:flex;gap:8px;flex-wrap:wrap}.link{background:none;border:0;color:var(--g);text-decoration:underline;font:inherit;cursor:pointer;padding:4px}

.loading{text-align:center;color:var(--mut);padding:30px}

 document.querySelectorAll("nav button").forEach(b=>{b.textContent=t("nav_"+b.dataset.v)})}

/* ---------- الصلاة ---------- */
let P=LS.get("prayer",null),lastTry=0;
const KEYS=["fajr","dhuhr","asr","maghrib","isha"];
async function loadPrayer(){lastTry=Date.now();try{P=await api("/api/prayer?country="+S.loc.k+"&city="+S.loc.c);LS.set("prayer",P)}catch(e){}tickP()}
const pad=n=>String(n).padStart(2,"0");
function tickP(){if(!P||!P.next)return;const left=Math.max(0,Math.round((Date.parse(P.next.iso)-Date.now())/1000));
 $("#pn").textContent=t("p_"+P.next.key);$("#pt").textContent=P.next.time;
 $("#cd").textContent=t("left")+" "+pad(Math.floor(left/3600))+":"+pad(Math.floor(left%3600/60))+":"+pad(left%60);
 $("#prayer").classList.toggle("soon",left<=600&&left>0);
 $("#times").innerHTML=KEYS.map(k=>'<div'+(k===P.next.key?' class="on"':'')+'>'+esc(t("p_"+k))+'<b>'+esc(P.times[k].time)+'</b></div>').join("");
 if(left===0&&Date.now()-lastTry>20000)loadPrayer()}
$("#prayer").addEventListener("click",()=>{S.tab="a";render()});

/* ---------- المباريات ---------- */
const LIVE=new Map();let es=null;
const isLive=s=>/^(1H|2H|ET|P|BT|LIVE)$/.test(s),isFin=s=>/^(FT|AET|PEN)$/.test(s);
function mrow(m){const lv=isLive(m.status),ht=m.status==="HT";
 const mid=(lv||ht||isFin(m.status))?(m.goals.home==null?0:m.goals.home)+" - "+(m.goals.away==null?0:m.goals.away):hm(m.kickoff);
 const sub=lv?(m.minute?m.minute+"'":t("st_live")):ht?t("st_ht"):isFin(m.status)?t("st_ft"):"";
 return '<div class="m'+(lv||ht?' live':'')+'"><div class="t">'+esc(m.home.name)+'</div><div class="c"><div class="score">'+mid+'</div><small>'+sub+'</small></div><div class="t">'+esc(m.away.name)+'</div></div>'}
function grouped(list,emptyKey){if(!list.length)return '<div class="note">'+t(emptyKey)+'</div>';const by={};list.forEach(m=>{const n=lname(m.league);(by[n]=by[n]||[]).push(m)});
 return Object.keys(by).map(k=>'<h2>'+esc(k)+'</h2>'+by[k].map(mrow).join("")).join("")}
const btn=(l,cur,act)=>'<button data-act="'+act+'" data-v="'+l.id+'" class="'+(String(l.id)===String(cur)?'on':'')+'">'+esc(lname(l))+'</button>';
const GROUPS=["top5","cups","arab","africa","national"];
const chips=(list,cur,act)=>{const first=list.filter(l=>!l.group).map(l=>btn(l,cur,act)).join("");let h=first?'<div class="chips">'+first+'</div>':'';
 GROUPS.forEach(g=>{const items=list.filter(l=>l.group===g);if(items.length)h+='<div class="gl">'+t("g_"+g)+'</div><div class="chips">'+items.map(l=>btn(l,cur,act)).join("")+'</div>'});return h};
let seq=0;
function paint(html){$("#view").innerHTML=html}
async function load(fn){const id=++seq;paint('<div class="loading">'+t("loading")+'</div>');try{const h=await fn();if(id===seq)paint(h)}catch(e){if(id===seq)paint(errBox(e))}}
const subSeg=()=>'<div class="seg"><button data-act="sub" data-v="live" class="'+(S.sub==="live"?'on':'')+'">'+t("live_now")+'</button><button data-act="sub" data-v="today" class="'+(S.sub==="today"?'on':'')+'">'+t("today")+'</button></div>';
function liveHtml(){return subSeg()+grouped([...LIVE.values()],"no_live")}
async function loadLive(){const l=await api("/api/live");LIVE.clear();l.forEach(f=>LIVE.set(f.id,f))}
async function viewMatches(){
 if(S.sub==="live"){await loadLive();return liveHtml()}
 const lab=t("all_leagues"),all=[{id:0,name:lab,en:lab}].concat(S.leagues);
 const r=await api("/api/matches"+(S.lgM?"?league="+S.lgM:""));
 return subSeg()+chips(all,S.lgM,"lgM")+grouped(r,"no_today")}
function refreshLive(){if(S.tab==="m"&&S.sub==="live")paint(liveHtml())}

/* ---------- الترتيب والهدافون والمنتخبات ---------- */
async function viewStandings(){const r=await api("/api/standings/"+S.lgS);
 const tb=r.table;const g=x=>(x>0?"+":"")+x;const cur=S.leagues.filter(l=>l.id===S.lgS)[0];
 return chips(S.leagues,S.lgS,"lgS")+(tb.length?'<h2>'+esc(t("standings_of")+" "+(cur?lname(cur):""))+'</h2><div class="tw"><table><tr><th>#</th><th>'+t("c_team")+'</th><th>'+t("c_p")+'</th><th>'+t("c_w")+'</th><th>'+t("c_d")+'</th><th>'+t("c_l")+'</th><th>'+t("c_gd")+'</th><th>'+t("c_pts")+'</th></tr>'+
 tb.map(x=>'<tr><td>'+x.rank+'</td><td>'+esc(x.team.name)+'</td><td>'+x.played+'</td><td>'+x.won+'</td><td>'+x.drawn+'</td><td>'+x.lost+'</td><td dir="ltr">'+(x.goalDiff==null?"–":g(x.goalDiff))+'</td><td><b>'+x.points+'</b></td></tr>').join("")+'</table></div>':'<div class="note">'+t("no_table")+'</div>')}
async function viewTop(){const r=await api("/api/"+(S.kind==="a"?"assists":"scorers")+"/"+S.lgT);
 const seg='<div class="seg"><button data-act="kind" data-v="g" class="'+(S.kind==="g"?'on':'')+'">'+t("scorers")+'</button><button data-act="kind" data-v="a" class="'+(S.kind==="a"?'on':'')+'">'+t("assists")+'</button></div>';
 return chips(S.leagues,S.lgT,"lgT")+seg+(r.length?r.slice(0,20).map(x=>'<div class="sc"><span class="k">'+x.rank+'</span><div class="w"><b class="pl">'+esc(x.player.name)+'</b><small>'+esc(x.team.name)+'</small></div><span class="g">'+(S.kind==="a"?x.assists:x.goals)+'</span></div>').join(""):'<div class="note">'+t("no_data")+'</div>')}
let natSel="Algeria";
async function viewNat(){const bar='<div class="chips">'+TEAMS.map(x=>'<button data-act="nat" data-v="'+x[0]+'" class="'+(x[0]===natSel?'on':'')+'">'+esc(region(x[1],x[0]))+'</button>').join("")+'</div>';
 const r=await api("/api/national/"+encodeURIComponent(natSel));
 return bar+(r.note&&LI===0?'<div class="note">'+esc(r.note)+'</div>':'')+'<h2>'+t("last_results")+' — '+esc(r.team.name)+'</h2>'+(r.last.map(mrow).join("")||'<div class="note">—</div>')+'<h2>'+t("next_matches")+'</h2>'+(r.next.map(mrow).join("")||'<div class="note">—</div>')}

/* ---------- الحساب والإعدادات ---------- */
const val=id=>($("#"+id)||{value:""}).value.trim();
function authHtml(){const m=S.auth,f=(id,ph,ty)=>'<input id="'+id+'" type="'+(ty||"text")+'" placeholder="'+esc(ph)+'" autocomplete="'+(ty==="password"?"current-password":id==="f-email"?"email":"off")+'">';
 let h='<div class="card"><h3>'+t("t_"+m)+'</h3><div id="msg"></div>';
 if(m==="register")h+=f("f-name",t("f_name"));
 if(m==="login"||m==="register"||m==="forgot")h+=f("f-email",t("f_email"),"email");
 if(m==="login"||m==="register")h+=f("f-pass",t("f_pass"),"password");
 if(m==="verify"||m==="reset")h+='<p class="note">'+t("sent_code")+' <b dir="ltr">'+esc(S.email)+'</b></p>'+f("f-code",t("f_code"));
 if(m==="reset")h+=f("f-pass",t("f_newpass"),"password");
 const bl={login:"b_login",register:"b_register",verify:"b_verify",forgot:"b_send",reset:"b_save"}[m];
 h+='<div class="row"><button class="btn" data-act="'+m+'">'+t(bl)+'</button>';
 if(m==="verify")h+='<button class="btn alt" data-act="resend">'+t("b_resend")+'</button>';
 h+='</div><div class="row" style="margin-top:8px">';
 if(m!=="login")h+='<button class="link" data-act="mode" data-v="login">'+t("have_acc")+'</button>';
 if(m!=="register")h+='<button class="link" data-act="mode" data-v="register">'+t("new_acc")+'</button>';
 if(m==="login")h+='<button class="link" data-act="mode" data-v="forgot">'+t("forgot_q")+'</button>';
 return h+'</div></div>'}
function profileHtml(){const u=S.user||{};return '<div class="card"><h3>👤 '+esc(u.name)+'</h3><p dir="ltr" style="text-align:start;margin:0 0 10px">'+esc(u.email)+'</p><div class="row"><button class="btn alt" data-act="logout">'+t("logout")+'</button><button class="btn red" data-act="delacc">'+t("delete_acc")+'</button></div></div>'}
function langHtml(){return '<div class="card"><h3>'+t("lang_h")+'</h3><select data-chg="lang">'+LANGS.map((l,i)=>'<option value="'+l[0]+'"'+(i===LI?' selected':'')+'>'+l[1]+'</option>').join("")+'</select></div>'}
async function settingsHtml(){let h='';
 try{const[cs,cities]=await Promise.all([api("/api/countries"),api("/api/countries/"+S.loc.k+"/cities")]);
  h+='<div class="card"><h3>'+t("city_h")+'</h3><select data-chg="country">'+cs.map(c=>'<option value="'+c.id+'"'+(c.id===S.loc.k?' selected':'')+'>'+esc(LI===0?c.name:region(c.iso,c.name))+'</option>').join("")+'</select><select data-chg="city">'+cities.map(c=>'<option value="'+c.id+'"'+(c.id===S.loc.c?' selected':'')+'>'+esc(LI===0?c.name:(c.en||c.name))+'</option>').join("")+'</select></div>'}
 catch(e){h+=errBox(e)}
 if(S.leagues.length)h+='<div class="card"><h3>'+t("alerts_h")+'</h3><p class="note" style="text-align:start;padding:0 0 8px">'+t("alerts_d")+'</p>'+S.leagues.map(l=>'<label class="chk"><input type="checkbox" data-chg="alert" value="'+l.id+'"'+(S.alerts.includes(l.id)?' checked':'')+'>'+esc(lname(l))+'</label>').join("")+'</div>';
 return h}
let installEv=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEv=e;if(S.tab==="a")render()});
const native=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const standalone=()=>(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
const installHtml=()=>native()||standalone()?'':installEv?'<button class="btn" data-act="install" style="margin-bottom:10px">'+t("install")+'</button>':'<p class="note" style="text-align:start;padding:0 0 8px">'+t("install_help")+'</p>';
const aboutHtml=()=>'<div class="card"><h3>'+t("about_h")+'</h3>'+installHtml()+'<p style="margin:0 0 6px">'+t("dev_by")+': <b>'+(LI===0?"عبد القادر أمين":"Abdelkader Amine")+'</b> — '+esc(region("DZ","الجزائر"))+' 🇩🇿</p><a class="link" href="'+esc(base())+'/privacy" target="_blank" rel="noopener">'+t("privacy")+'</a></div>';
const noAcc=()=>'<div class="card"><h3>'+t("acc_h")+'</h3><p class="note" style="text-align:start;padding:0">'+t("acc_off_t")+'</p></div>';
async function viewAccount(){return langHtml()+(S.token?profileHtml():S.accounts===false?noAcc():authHtml())+await settingsHtml()+aboutHtml()}
function msg(text,ok){const m=$("#msg");if(m)m.innerHTML=text?'<div class="'+(ok?'note':'err')+'">'+esc(text)+'</div>':""}
function applyUser(r){S.token=r.token;S.user=r.user;LS.set("token",r.token);LS.set("user",r.user);const st=r.user.settings||{};
 S.loc={k:st.country||0,c:st.city||0};S.alerts=st.leagues||[];LS.set("loc",S.loc);LS.set("alerts",S.alerts);loadPrayer();openStream();syncDevice();render()}
function sync(){if(!S.token)return;api("/api/me/settings",{method:"PUT",body:{country:S.loc.k,city:S.loc.c,leagues:S.alerts,teams:[]}}).catch(()=>{})}
async function authAct(a){try{
 if(a==="login"){S.email=val("f-email");const r=await api("/api/auth/login",{method:"POST",body:{email:S.email,password:$("#f-pass").value}});applyUser(r)}
 else if(a==="register"){S.email=val("f-email");await api("/api/auth/register",{method:"POST",body:{name:val("f-name"),email:S.email,password:$("#f-pass").value}});S.auth="verify";render()}
 else if(a==="verify"){const r=await api("/api/auth/verify",{method:"POST",body:{email:S.email,code:val("f-code")}});applyUser(r)}
 else if(a==="resend"){await api("/api/auth/resend",{method:"POST",body:{email:S.email}});msg(t("code_resent"),true)}
 else if(a==="forgot"){S.email=val("f-email");await api("/api/auth/forgot",{method:"POST",body:{email:S.email}});S.auth="reset";render()}
 else if(a==="reset"){await api("/api/auth/reset",{method:"POST",body:{email:S.email,code:val("f-code"),password:$("#f-pass").value}});S.auth="login";await render();msg(t("pass_changed"),true)}
}catch(e){if(e.data&&e.data.needsVerify){S.auth="verify";await render();msg(t("need_verify"))}else msg(errText(e))}}

/* ---------- البث المباشر والإشعارات ---------- */
function openStream(){if(es){es.close();es=null}if(!S.football||!window.EventSource)return;
 es=new EventSource(base()+"/api/stream");
 es.addEventListener("live",e=>{JSON.parse(e.data).fixtures.forEach(f=>LIVE.set(f.id,f));refreshLive()});
 es.addEventListener("finished",e=>{JSON.parse(e.data).ids.forEach(i=>LIVE.delete(i));refreshLive()});
 es.addEventListener("goal",e=>{const d=JSON.parse(e.data),f=d.fixture;if(!S.alerts.includes(f.league.id))return;
  const line=f.home.name+" "+f.goals.home+" - "+f.goals.away+" "+f.away.name,who=(d.scorer.player?d.scorer.player+" ":"")+(d.scorer.minute?d.scorer.minute+"'":"");
  toast(t("goal")+" "+line+(who?" — "+who:""));try{if(navigator.vibrate)navigator.vibrate([200,100,200]);if(window.Notification&&Notification.permission==="granted")new Notification(t("goal"),{body:line+(who?"\n"+who:"")})}catch(x){}})}

/* ---------- إشعارات الهاتف (تطبيق Capacitor فقط) ---------- */
S.pushToken=LS.get("pushToken","");
function syncDevice(){if(!S.pushToken)return;api("/api/devices",{method:"POST",body:{token:S.pushToken,platform:(Capacitor.getPlatform&&Capacitor.getPlatform())||"android",leagues:S.alerts}}).catch(()=>{})}
let pushOn=false;
async function initPush(){if(!native()||pushOn)return;const Pn=Capacitor.Plugins&&Capacitor.Plugins.PushNotifications;if(!Pn)return;
 try{let st=await Pn.checkPermissions();if(st.receive==="prompt")st=await Pn.requestPermissions();if(st.receive!=="granted")return;
  pushOn=true;
  Pn.addListener("registration",x=>{S.pushToken=x.value;LS.set("pushToken",x.value);syncDevice()});
  Pn.addListener("registrationError",()=>{pushOn=false});
  Pn.addListener("pushNotificationReceived",n=>toast((n.title||"")+" "+(n.body||"")));
  await Pn.register()}catch(e){pushOn=false}}

/* ---------- التنقل ---------- */
async function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.tab));
 const x=S.tab;await load(x==="m"?viewMatches:x==="s"?viewStandings:x==="t"?viewTop:x==="n"?viewNat:viewAccount)}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,v=el.dataset.v;
 if(a==="tab"){S.tab=v;render()}
 else if(a==="sub"){S.sub=v;render()}
 else if(a==="lgM"){S.lgM=+v;render()}else if(a==="lgS"){S.lgS=+v;render()}else if(a==="lgT"){S.lgT=+v;render()}
 else if(a==="kind"){S.kind=v;render()}else if(a==="nat"){natSel=v;render()}
 else if(a==="mode"){S.auth=v;render()}
 else if(["login","register","verify","resend","forgot","reset"].includes(a))authAct(a);
 else if(a==="logout"){S.token="";S.user=null;LS.set("token","");LS.set("user",null);S.auth="login";render()}
 else if(a==="delacc"){if(!confirm(t("del_confirm")))return;const p=prompt(t("del_prompt"));if(!p)return;
  api("/api/me",{method:"DELETE",body:{password:p}}).then(()=>{S.token="";S.user=null;LS.set("token","");LS.set("user",null);toast(t("del_done"));render()}).catch(x=>toast(errText(x)))}
 else if(a==="install"){if(installEv){installEv.prompt();installEv=null}}});
document.addEventListener("change",e=>{const el=e.target.closest("[data-chg]");if(!el)return;const c=el.dataset.chg;
 if(c==="lang"){const i=LANGS.findIndex(l=>l[0]===el.value);LS.set("lang",el.value);setLang(i<0?0:i);applyStatic();tickP();render()}
 else if(c==="country"){S.loc={k:+el.value,c:0};LS.set("loc",S.loc);loadPrayer();sync();render()}
 else if(c==="city"){S.loc.c=+el.value;LS.set("loc",S.loc);loadPrayer();sync()}
 else if(c==="alert"){const id=+el.value;S.alerts=el.checked?[...new Set([...S.alerts,id])]:S.alerts.filter(x=>x!==id);LS.set("alerts",S.alerts);sync();initPush();syncDevice();
  if(el.checked&&window.Notification&&Notification.permission==="default")Notification.requestPermission()}});

async function boot(){
 setLang(pickLang());applyStatic();
 try{const h=await api("/api/health");S.football=!!h.football;S.accounts=h.accounts;S.leagues=await api("/api/leagues");
  if(S.leagues.length&&!S.leagues.some(l=>l.id===S.lgS)){S.lgS=S.lgT=S.leagues[0].id}
  if(S.token){try{const u=await api("/api/me");S.user=u;LS.set("user",u)}catch(e){if(e.status===401){S.token="";S.user=null;LS.set("token","")}}}
  await loadPrayer();openStream();if(S.alerts.length)initPush();syncDevice()}
 catch(e){S.tab="a"}
 render()}
if("serviceWorker"in navigator&&!native()&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
setInterval(tickP,1000);
boot();
})();
</script>
